<!DOCTYPE html>
<html lang="he">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    style-src 'self' https://fonts.googleapis.com 'unsafe-inline' https://cdn.jsdelivr.net;
    font-src 'self' https://fonts.gstatic.com data:;
    script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline' http://code.jquery.com;
    img-src 'self' https://picsum.photos https://fastly.picsum.photos data:;
  " />




  <title>📷 Club TLV</title>

  <link rel="stylesheet" href="../styles/main.css" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100&display=swap" rel="stylesheet" />
</head>

<body class="m-0 bg-dark text-white">
  <!-- --- NavBar --- -->
  <nav class="navbar sticky-top navbar-expand-lg bg-body-tertiary bg-dark border-bottom border-body myNavBar"
    data-bs-theme="dark" dir="rtl">
    <div class="container-fluid">
      <form id="brandForm" action="/" method="GET" class="navbar-brand bg-dark">
        <button class="navbar-brand bg-dark border-0" type="submit" aria-current="page">
          <object type="image/svg+xml" data="/pictures/nikon-fm2.svg" width="40px" height="30px">
            <!-- Fallback image or text if SVG is not supported -->
            📷
          </object>
          מועדון צילום תל אביב
        </button>
      </form>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <form id="homeForm" action="/home" method="GET">
              <button class="nav-link" type="submit" aria-current="page">
                בית
              </button>
            </form>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled" href="#">אודות</a>
          </li>
          <li class="nav-item">
            <form id="membersNav" action="/members" method="GET">
              <button class="nav-link" type="submit" aria-current="page">
                חברים
              </button>
            </form>
          </li>
          <li class="nav-item dropdown">
            <!-- Dropdown when there are exhibitions -->
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              תערוכות
            </a>

            <ul class="dropdown-menu">
              <li>
                <form action="/exhibitions" method="GET">
                  <input type="hidden" name="exhibition" value="2024">
                  <button class="dropdown-item" type="submit">
                    2024
                  </button>
                </form>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="d-flex flex-column min-vh-100">
    <div class="container my-5 bg-dark text-white flex-grow-1 p-1">

      <!-- MEMBER 1 -->
      <div class="row align-items-center mb-5">

        <!-- Photo -->
        <div class="col-12 col-md-6 order-1 order-md-1 text-center ">
          <div class="photo-box-sqr mx-auto">
            <img src="../members/Moshe_Gross/id_sConnery-2048x2048.jpg" class="img-fluid rounded" alt="Moshe Gross">
          </div>
        </div>

        <!-- Text -->
        <div class="col-12 col-md-6 order-2 order-md-2 mt-3 mt-md-0 x-4 py-3">
          <h3>משה גרוס</h3>
          <p>
            צלם דוקומנטרי מתל אביב. עובד בעיקר עם סרטי פורמט בינוני ופרויקטים ארוכי טווח.
          </p>
        </div>

      </div>

      <!-- MEMBER 2 -->
      <div class="row align-items-center mb-5">

        <!-- Photo -->
        <div class="col-12 col-md-6 order-1 order-md-2 text-center">
          <div class="photo-box-sqr mx-auto">
            <img src="../members/Rahel_Rinat_hilling/id_lCroft_thumb-1920-644894.jpg" class="img-fluid rounded"
              alt="Rahel">
          </div>
        </div>

        <!-- Text -->
        <div class="col-12 col-md-6 order-1 order-md-1 mt-3 mt-md-0 px-4 py-3">
          <h3>רחל רינת הילינג</h3>
          <p>
            צלמת רחוב, ארכיטקטורה ודיוקנאות.
            חוקרת זהות עירונית וזיכרון.
          </p>
        </div>

      </div>

      <!-- MEMBER 3 -->
      <div class="row align-items-center mb-5">

        <!-- Photo -->
        <div class="col-12 col-md-6 order-1 order-md-1 text-center">
          <div class="photo-box-sqr mx-auto">
            <img src="../members/Ronen_Boneh/id_jack-bauer-wallpaper.jpg" class="img-fluid rounded" alt="Ronen">
          </div>
        </div>

        <!-- Text -->
        <div class="col-12 col-md-6 order-2 order-md-2 mt-3 mt-md-0 px-4 py-3">
          <h3>רונן בונה</h3>
          <p>
            צלם נוף, נוף אורבני ואנשים. עובד עם מצלמות מדיום פורמט ו 35ממ.
          </p>
        </div>

      </div>

    </div>

    <footer class="bg-secondary text-center py-3 mt-auto text-white-50">
      <div class="container">
        <p class="mx-auto">
          Copyright © <span id="year"></span>
        </p>
      </div>

    </footer>
  </div>

</body>


<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
<script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
